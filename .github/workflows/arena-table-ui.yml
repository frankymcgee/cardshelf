name: Validate Arena table UI
on:
  pull_request:
    paths: ['app/components/arena/**', 'app/pages/arena/matches/**', 'app/assets/css/**', 'shared/arena.mjs', 'shared/arena-effects.mjs', 'tests/browser/**', 'tests/helpers/arena-table-fixtures.mjs', 'package*.json', '.github/workflows/arena-table-ui.yml']
  workflow_dispatch:
  workflow_call:
# Only PR revisions share a group. Release calls and manual runs stay independent
# of each other and of the parent release workflow's concurrency group.
concurrency:
  group: cardshelf-arena-table-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  table-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check actual Arena components in Chromium and WebKit
        run: npm run test:arena-ui
      - name: Check confirmed battle effects in Chromium and WebKit
        run: npm run test:arena-effects
      - name: Upload browser results and table previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arena-table-ui-evidence
          path: |
            test-results/arena-table
            playwright-report/arena-table
            test-results/arena-effects
            playwright-report/arena-effects

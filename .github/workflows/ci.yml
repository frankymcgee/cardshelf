name: Validate CardShelf
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: cardshelf
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cardshelf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardshelf -d cardshelf_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://cardshelf:test-only-password@127.0.0.1:5432/cardshelf_test
      APP_ORIGIN: http://localhost:3000
      BOOTSTRAP_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TEST_BASE_URL: http://localhost:3000
      ALLOW_TEST_DATABASE: 'yes'
      # Keep queue processing explicit in tests; never contact a live mail provider.
      EMAIL_WORKER_ENABLED: 'false'
      CARDSHELF_INTEGRATION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate
      - name: Start production Node server
        run: |
          npm start > /tmp/cardshelf-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/cardshelf-server.log
          exit 1
      - run: npm run test:integration
      - name: Install scanner browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:scanning-ui
      - run: npm run test:ads-ui
      - name: Upload resolved lockfile and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: |
            package-lock.json
            /tmp/cardshelf-server.log

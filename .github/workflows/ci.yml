name: Validate CardShelf
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: cardshelf-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: cardshelf
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cardshelf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardshelf -d cardshelf_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://cardshelf:test-only-password@127.0.0.1:5432/cardshelf_test
      APP_ORIGIN: http://localhost:3000
      BOOTSTRAP_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TEST_BASE_URL: http://localhost:3000
      ALLOW_TEST_DATABASE: 'yes'
      # Keep queue processing explicit in tests; never contact a live mail provider.
      EMAIL_WORKER_ENABLED: 'false'
      PUSH_WORKER_ENABLED: 'false'
      CARDSHELF_INTEGRATION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Audit critical build dependencies
        run: npm audit --audit-level=critical
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Audit generated server dependencies
        run: npm run audit:runtime
      - run: npm run migrate
      - name: Start production Node server
        run: |
          npm start > /tmp/cardshelf-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/cardshelf-server.log
          exit 1
      - run: npm run test:integration
      - name: Install UI browsers
        timeout-minutes: 15
        run: |
          # The hosted Azure mirror can stall on small font packages for minutes.
          # Keep Ubuntu's signed packages, using its main HTTPS archive instead.
          # https://github.com/actions/runner-images/issues/14594
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          npx playwright install --with-deps chromium webkit
      - run: npm run test:collection-ui
      - run: npm run test:security-ui
      - run: npm run test:release-ui
      - run: npm run test:scan-batch-ui
      - run: npm run test:scanning-ui
      - run: npm run test:ads-ui
      - run: npm run test:pricing-ui
      - run: npm run test:affiliates-ui
      - run: npm run test:themes-ui
      - run: npm run test:affiliates-live
      - run: npm run test:binder-completion-ui
      - run: npm run test:value-history-ui
      - run: npm run test:variant-effects-ui
      - run: npm run test:push-ui
      - run: npm run test:card-images-ui
      - run: npm run test:binder-cover-ui
      - name: Upload resolved lockfile and server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence
          path: |
            package-lock.json
            /tmp/cardshelf-server.log
            test-results/account-security
            test-results/release
            test-results/pricing-admin
            test-results/themes
            test-results/affiliate-live
            test-results/binder-completion
            test-results/scan-batch
            test-results/value-history
            test-results/collection-ui
            test-results/variant-effects
            test-results/push
            test-results/card-images
            test-results/binder-cover

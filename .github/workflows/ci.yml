name: Validate CardShelf
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: cardshelf-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: cardshelf
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cardshelf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardshelf -d cardshelf_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://cardshelf:test-only-password@127.0.0.1:5432/cardshelf_test
      APP_ORIGIN: http://localhost:3000
      BOOTSTRAP_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TEST_BASE_URL: http://localhost:3000
      ALLOW_TEST_DATABASE: 'yes'
      # Keep queue processing explicit in tests; never contact a live mail provider.
      EMAIL_WORKER_ENABLED: 'false'
      CARDSHELF_INTEGRATION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare artifact transfer checks
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-check"
          for arch in amd64 arm64; do
            printf '%s\n' "$GITHUB_SHA-$arch" > "$RUNNER_TEMP/artifact-check/payload-$arch.txt"
            tar -czf "$RUNNER_TEMP/artifact-check/image-$arch.tar.gz" -C "$RUNNER_TEMP/artifact-check" "payload-$arch.txt"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-check-amd64
          path: ${{ runner.temp }}/artifact-check/image-amd64.tar.gz
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-check-arm64
          path: ${{ runner.temp }}/artifact-check/image-arm64.tar.gz
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifact-check-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifact-roundtrip
      - name: Verify archive names, layout and bytes after transfer
        run: |
          for arch in amd64 arm64; do
            cmp "$RUNNER_TEMP/artifact-check/image-$arch.tar.gz" "$RUNNER_TEMP/artifact-roundtrip/image-$arch.tar.gz"
            tar -xzf "$RUNNER_TEMP/artifact-roundtrip/image-$arch.tar.gz" -C "$RUNNER_TEMP/artifact-roundtrip"
            cmp "$RUNNER_TEMP/artifact-check/payload-$arch.txt" "$RUNNER_TEMP/artifact-roundtrip/payload-$arch.txt"
          done
      - name: Install locked dependencies
        run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate
      - name: Start production Node server
        run: |
          npm start > /tmp/cardshelf-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/cardshelf-server.log
          exit 1
      - run: npm run test:integration
      - name: Install scanner browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:scan-batch-ui
      - run: npm run test:scanning-ui
      - run: npm run test:ads-ui
      - run: npm run test:pricing-ui
      - run: npm run test:affiliates-ui
      - run: npm run test:themes-ui
      - run: npm run test:affiliates-live
      - run: npm run test:binder-completion-ui
      - run: npm run test:value-history-ui
      - name: Upload resolved lockfile and server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence
          path: |
            package-lock.json
            /tmp/cardshelf-server.log
            test-results/themes
            test-results/affiliate-live
            test-results/binder-completion
            test-results/scan-batch
            test-results/value-history

  release-arena-table:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/arena-table-ui.yml

  release-arena-match:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/arena-match-ui.yml

  image:
    name: Build and verify image (${{ matrix.arch }})
    needs: [test, release-arena-table, release-arena-match]
    if: >-
      always() && !cancelled() && needs.test.result == 'success' &&
      (github.event_name == 'pull_request' ||
       (github.ref == 'refs/heads/main' && needs.release-arena-table.result == 'success' && needs.release-arena-match.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release metadata
        id: release
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "contract=$(sh scripts/deployment-contract.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: cardshelf:ci-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            DEPLOYMENT_CONTRACT=${{ steps.release.outputs.contract }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=cardshelf-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cardshelf-${{ matrix.arch }}
      - name: Verify runtime, migrations, backup and pull-based upgrade
        env:
          CARDSHELF_IMAGE_TEST: 'yes'
          TEST_IMAGE: cardshelf:ci-${{ matrix.arch }}
        run: bash scripts/test-image.sh "$TEST_IMAGE"
      - name: Export the tested main-branch image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: docker save "cardshelf:ci-$IMAGE_ARCH" | gzip > "$RUNNER_TEMP/image-$IMAGE_ARCH.tar.gz"
      - name: Retain tested image for publishing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar.gz
          archive: true
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  publish:
    name: Publish release images
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested images and promote the multi-platform release
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          repository=${IMAGE_REPOSITORY,,}
          version=$(node -p 'require("./package.json").version')
          sources=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/release-images/image-$arch.tar.gz"
            tag="$repository:sha-$GITHUB_SHA-$arch"
            docker tag "cardshelf:ci-$arch" "$tag"
            docker push "$tag"
            digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | awk -v prefix="$repository@sha256:" 'index($0,prefix)==1 { print; exit }')
            test -n "$digest"
            sources+=("$digest")
          done
          docker buildx imagetools create \
            --tag "$repository:$version" \
            --tag "$repository:sha-$GITHUB_SHA" \
            --tag "$repository:stable" "${sources[@]}"
          docker buildx imagetools inspect "$repository:stable"
          printf 'Published `%s:%s` and `:stable` for linux/amd64 and linux/arm64.\n' "$repository" "$version" >> "$GITHUB_STEP_SUMMARY"

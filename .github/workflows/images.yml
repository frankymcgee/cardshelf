name: Build and publish CardShelf images
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cardshelf-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  image:
    name: Build and verify image (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release metadata
        id: release
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "contract=$(sh scripts/deployment-contract.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: cardshelf:ci-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            DEPLOYMENT_CONTRACT=${{ steps.release.outputs.contract }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=cardshelf-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cardshelf-${{ matrix.arch }}
      - name: Verify runtime, migrations, backup and pull-based upgrade
        env:
          CARDSHELF_IMAGE_TEST: 'yes'
          TEST_IMAGE: cardshelf:ci-${{ matrix.arch }}
        run: bash scripts/test-image.sh "$TEST_IMAGE"
      - name: Export the tested main-branch image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: docker save "cardshelf:ci-$IMAGE_ARCH" | gzip > "$RUNNER_TEMP/image-$IMAGE_ARCH.tar.gz"
      - name: Retain tested image for publishing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar.gz
          archive: true
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  publish:
    name: Publish release images
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare artifact transfer checks
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-check"
          for arch in amd64 arm64; do
            printf '%s\n' "$GITHUB_SHA-$arch" > "$RUNNER_TEMP/artifact-check/payload-$arch.txt"
            tar -czf "$RUNNER_TEMP/artifact-check/image-$arch.tar.gz" -C "$RUNNER_TEMP/artifact-check" "payload-$arch.txt"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: check_amd64
        with:
          name: artifact-check-amd64
          path: ${{ runner.temp }}/artifact-check/image-amd64.tar.gz
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: check_arm64
        with:
          name: artifact-check-arm64
          path: ${{ runner.temp }}/artifact-check/image-arm64.tar.gz
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # A rerun can list a previous attempt's artifact with the same name.
          artifact-ids: ${{ steps.check_amd64.outputs.artifact-id }},${{ steps.check_arm64.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/artifact-roundtrip
      - name: Verify archive names, layout and bytes after transfer
        run: |
          for arch in amd64 arm64; do
            cmp "$RUNNER_TEMP/artifact-check/image-$arch.tar.gz" "$RUNNER_TEMP/artifact-roundtrip/image-$arch.tar.gz"
            tar -xzf "$RUNNER_TEMP/artifact-roundtrip/image-$arch.tar.gz" -C "$RUNNER_TEMP/artifact-roundtrip"
            cmp "$RUNNER_TEMP/artifact-check/payload-$arch.txt" "$RUNNER_TEMP/artifact-roundtrip/payload-$arch.txt"
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested images and promote the multi-platform release
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          repository=${IMAGE_REPOSITORY,,}
          version=$(node -p 'require("./package.json").version')
          sources=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/release-images/image-$arch.tar.gz"
            tag="$repository:sha-$GITHUB_SHA-$arch"
            docker tag "cardshelf:ci-$arch" "$tag"
            docker push "$tag"
            digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | awk -v prefix="$repository@sha256:" 'index($0,prefix)==1 { print; exit }')
            test -n "$digest"
            sources+=("$digest")
          done
          docker buildx imagetools create \
            --tag "$repository:$version" \
            --tag "$repository:sha-$GITHUB_SHA" \
            --tag "$repository:stable" "${sources[@]}"
          docker buildx imagetools inspect "$repository:stable"
          printf 'Published `%s:%s` and `:stable` for linux/amd64 and linux/arm64.\n' "$repository" "$version" >> "$GITHUB_STEP_SUMMARY"
